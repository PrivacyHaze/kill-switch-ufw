TXT_MG_UNINSTALL=Удалить Glow?
TXT_MG_UNIN=Возможно, программа была установлена этим приложением.

TXT_MF_UNINSTALL=Начать удаление?
TXT_MF_CONFIRM=Выберите ниже компоненты, которые нужно удалить.

TXT_ME_COPY=Скопировать файлы скрипта в /usr/local/bin и /usr/local/share? (рекомендуется)
