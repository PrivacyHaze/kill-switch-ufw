TXT_MK_LANGFILE=Языковой файл был изменён! Всё равно продолжить?
TXT_MJ_SYNTAXINFO=В основном файле обнаружена ошибка синтаксиса. Всё равно продолжить?

TXT_MI_UNINSTALL_MAIN=Удалить все файлы kill-switch-ufw из /usr/local/bin и /usr/local/share?
