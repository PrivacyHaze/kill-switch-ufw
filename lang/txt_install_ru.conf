TXT_MD_HELP=Выполните kill-switch-ufw --help, чтобы просмотреть дополнительные параметры.

TXT_MC_RESET=Отключать Kill Switch после каждой перезагрузки?
TXT_MC_CONNECT=Это может быть полезно, поскольку иначе первоначальное подключение к VPN может завершиться с ошибкой. Для этого будет настроена служба systemd.
TXT_MC_INFO=Позже этим параметром можно управлять с помощью следующих команд:
TXT_MC_ENA_SERVICE=sudo kill-switch-ufw -y или sudo kill-switch-ufw --reboot-onoff
TXT_MC_DEL_SERVICE=Чтобы удалить службу, запустите этот установочный файл с параметром 'uninstall'.
TXT_MC_INSTALL_OK=Служба настроена
TXT_MC_INSTALL_ERR=Не удалось настроить службу

TXT_MB_GLOW=Установить Glow?
TXT_MB_GLOW_DESCR=Glow отображает файлы Markdown, обеспечивая современное и наглядное представление справки --help.

TXT_MA_INSTALL=Начать установку?
TXT_MA_DESCRIBE=kill-switch-ufw защищает VPN-соединения от утечек IP-адресов и DNS. Подход на основе межсетевого экрана надёжен и экономно использует ресурсы.
TXT_MA_FIREWALL=Если вы забудете включить межсетевой экран, kill-switch-ufw сделает это при запуске приложения.
TXT_MA_KILLSWITCH=Поэтому всегда держите межсетевой экран включённым! ^_^

